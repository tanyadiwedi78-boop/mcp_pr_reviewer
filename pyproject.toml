[project]
name = "sql-mcp-assistant"
version = "0.1.0"
description = "Automated Software Engineering Auditor MCP Server for GitHub PR reviews and Notion reporting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]==1.9.4",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "PyGithub>=2.1.1",
    "notion_client>=2.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
